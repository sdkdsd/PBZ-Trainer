name: CI

on:
  push:
    branches: [main, master, 'step*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Windows / Python 3.13)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run unit tests
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: UI self-check
        run: python app.py --self-check --report ui-check.json

      - name: Upload self-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-check
          path: ui-check.json
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build EXE (optional)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: pip install -r requirements-build.txt

      - name: Build one-file EXE
        run: python build_exe.py --output dist
        env:
          # GitHub-hosted Windows runners use cp1252; Chinese EXE name in the final print needs UTF-8.
          PYTHONIOENCODING: utf-8

      - name: Upload EXE and build report
        uses: actions/upload-artifact@v4
        with:
          name: pbz-trainer-exe
          path: |
            dist/*.exe
            .build/onefile/build-report.json
          if-no-files-found: error
          retention-days: 14
